:var(--muted)}.calendar-day{min-height:112px;padding:6px;background:#fff}.calendar-day.muted{background:#fafcff;color:#94a3b8}.calendar-day.today{box-shadow:inset 0 0 0 2px #1d6398}.calendar-date{font-size:12px;font-weight:700;margin-bottom:5px}.calendar-event{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;border-radius:5px;padding:3px 5px;margin:3px 0;background:#e8eef4;color:#274560;font-size:11px;font-weight:600}.calendar-event.high{background:#fee2e2;color:#b91c1c}.calendar-event.done{background:#dcfce7;color:#166534}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(420px,100%);padding:26px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 35px #12375716}.auth-card h1{color:var(--navy);font-size:21px}.auth-card p{color:var(--muted);font-size:13px;line-height:1.7}.auth-card label,.form label{display:block;font-size:12px;font-weight:700;color:#475569;margin:12px 0 5px}.auth-card button{width:100%;margin-top:12px}.notice{min-height:20px;font-size:13px;color:#075985;margin:11px 0 0}.account{font-size:12px;text-align:right;color:#d5e8f7}.account button{margin-left:8px;padding:6px 8px;background:#fff;color:#123757}
    dialog{width:min(720px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:14px;box-shadow:0 20px 70px #0f172a77;overflow:hidden}dialog[open]{display:flex;flex-direction:column}dialog::backdrop{background:#0f172a80}.modal-head{padding:15px 19px;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;flex:none}.modal-head h2{margin:0;font-size:17px}.modal{min-height:0;padding:18px;overflow:auto;-webkit-overflow-scrolling:touch}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.project-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;margin-top:9px}.help{font-size:12px;color:var(--muted);margin:9px 0 0}
    @media(max-width:720px){body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:5;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}header p{display:none}h1{font-size:18px}main{margin-top:12px;padding:0 12px 18px}.topbar{align-items:stretch;flex-direction:column;padding:10px}.tabs{margin-right:-2px;scroll-snap-type:x proximity}.project-tab{scroll-snap-align:start}.topbar #manageProjects{min-height:42px}.filters{grid-template-columns:1fr 1fr;margin:12px 0}.filters input{grid-column:1/-1}.filters button{grid-column:1/-1;min-height:44px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px}.metric strong{font-size:23px}.panel{padding:13px}.panel-head{margin-bottom:8px}.issue{grid-template-columns:auto 1fr;gap:9px;padding:14px 0}.issue>div:last-child{grid-column:2;display:flex;align-items:center;justify-content:space-between;gap:8px}.issue .actions{justify-content:flex-start}.issue .actions button{min-height:38px}.sub{line-height:1.55}.photo-preview{max-width:100%;max-height:200px}.form-grid{grid-template-columns:1fr;gap:4px}.wide{grid-column:auto}.form input,.form select,.form textarea{font-size:16px;min-height:44px}.form textarea{min-height:104px}.modal{padding:14px}.modal-head{padding:13px 14px}.modal-head .mini{min-width:40px;min-height:40px;font-size:18px}.modal-actions{position:sticky;bottom:-14px;background:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:12px}.modal-actions button{min-height:46px;flex:1}.project-row{grid-template-columns:minmax(0,1fr) auto auto}.project-row button{min-height:42px}.notice{padding-bottom:8px}#newIssue{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;min-height:52px;border-radius:999px;padding:0 20px;box-shadow:0 8px 22px #12375755}.panel-head #newIssue{margin-left:auto}.calendar-day{min-height:86px;padding:4px}.calendar-event{font-size:10px;padding:3px}.calendar-weekday{font-size:11px;padding:6px 1px}}

</head>
<body>
  <div id="workspace">
    <header>
      <div><h1>現場 未対応事項管理</h1><p>工事ごとの確認事項・回答待ち・期限をチームで共有</p></div>
    </header>
    <main>
      <section class="topbar">
        <div id="projectTabs" class="tabs"></div>
        <button id="manageProjects" class="secondary">工事を管理</button>
      </section>
      <section class="filters">
        <input id="search" placeholder="内容・担当者・メモを検索">
        <select id="statusFilter"><option value="">状態：すべて</option><option>未着手</option><option>対応中</option><option>回答待ち</option><option>完了</option></select>
        <select id="priorityFilter"><option value="">優先度：すべて</option><option>高</option><option>中</option><option>低</option></select>
        <input id="dueFilter" type="date" title="対応期間で絞り込み">
        <button id="clearFilters" class="secondary">条件を消す</button>
      </section>
      <section class="metrics">
        <div class="metric danger"><span>未完了</span><strong id="openCount">0</strong></div>
        <div class="metric danger"><span>期限超過</span><strong id="overdueCount">0</strong></div>
        <div class="metric"><span>回答待ち</span><strong id="waitingCount">0</strong></div>
        <div class="metric"><span>完了</span><strong id="doneCount">0</strong></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>全現場の対応カレンダー</h2><div class="calendar-nav"><button id="calendarPrev" class="secondary mini" aria-label="前月">‹</button><strong id="calendarTitle"></strong><button id="calendarNext" class="secondary mini" aria-label="次月">›</button></div></div>
        <div id="calendar" class="calendar"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2 id="listTitle">未対応事項</h2><div class="actions"><button id="excelExport" class="secondary">Excel出力</button><button id="newIssue" class="primary">＋ 事項を追加</button></div></div>
        <div id="issues"></div><div id="empty" class="empty" hidden>該当する未対応事項はありません。</div>
      </section>
      <p id="appNotice" class="notice"></p>
    </main>
  </div>

  <dialog id="issueDialog">
    <div class="modal-head"><h2 id="issueDialogTitle">未対応事項を追加</h2><button id="closeIssue" class="secondary mini">×</button></div>
    <form id="issueForm" class="modal form">
      <div class="form-grid">
        <div class="wide"><label for="title">内容 *</label><input id="title" required placeholder="例：サッシ納まりの詳細確認"></div>
        <div><label for="source">発信元</label><input id="source" placeholder="例：設計、施主、協力会社"></div>
        <div><label for="assignee">担当者 *</label><input id="assignee" required placeholder="例：建築担当"></div>
        <div><label for="requiredPersonnel">必要人員</label><input id="requiredPersonnel" placeholder="例：職長1名・作業員3名"></div>
        <div><label for="requiredEquipment">必要機材</label><input id="requiredEquipment" placeholder="例：高所作業車1台・発電機1台"></div>
        <div><label for="workStartDate">対応開始日 *</label><input id="workStartDate" type="date" required></div>
        <div><label for="workEndDate">対応完了日 *</label><input id="workEndDate" type="date" required></div>
        <div><label for="priority">優先度 *</label><select id="priority"><option>高</option><option selected>中</option><option>低</option></select></div>
        <div><label for="status">状態 *</label><select id="status"><option selected>未着手</option><option>対応中</option><option>回答待ち</option><option>完了</option></select></div>
        <div><label for="beforePhoto">対応前写真（任意）</label><input id="beforePhoto" type="file" accept="image/*"><p class="help">端末の写真・ファイルストレージから選択できます。</p><div id="beforePreview"></div></div>
        <div><label for="afterPhoto">対応後写真（任意）</label><input id="afterPhoto" type="file" accept="image/*"><p class="help">端末の写真・ファイルストレージから選択できます。</p><div id="afterPreview"></div></div>
        <div class="wide"><label for="memo">確認・次アクション</label><textarea id="memo" placeholder="依頼先、確認内容、次に行うことを記入"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" id="cancelIssue" class="secondary">キャンセル</button><button class="primary">保存する</button></div>
    </form>
  </dialog>

  <dialog id="calendarDetailDialog">
    <div class="modal-head"><h2>未対応事項の詳細</h2><button id="closeCalendarDetail" class="secondary mini">×</button></div>
    <div id="calendarDetailBody" class="modal"></div>
    <div class="modal-actions"><button id="editCalendarIssue" class="primary">編集する</button><button id="doneCalendarDetail" class="secondary">閉じる</button></div>
  </dialog>

  <dialog id="projectDialog">
    <div class="modal-head"><h2>工事を管理</h2><button id="closeProjects" class="secondary mini">×</button></div>
    <div class="modal">
      <label for="newProject">新しい工事名</label>
      <div class="project-row"><input id="newProject" placeholder="例：△△改修工事"><button id="addProject" class="primary mini">追加</button><span></span></div>
      <p class="help">工事名はチーム全員に反映されます。未対応事項がある工事は削除できません。</p>
      <div id="projectList"></div>
      <div class="modal-actions"><button id="doneProjects" class="secondary">閉じる</button></div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script>
  (function(){
    const SUPABASE_URL='https://schttjeinzdhjemgtdvi.supabase.co';
    const SUPABASE_KEY='sb_publishable_7HgyHI9HKDD5lvyPnX3tSA_ptePV39_';
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=function(id){return document.getElementById(id);};
    const esc=function(value){return String(value||'').replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});};
    const today=function(){return new Date().toISOString().slice(0,10);};
    const dateLabel=function(v){return v?new Date(v+'T00:00:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'';};
    const rangeLabel=function(start,end){return dateLabel(start)+'～'+dateLabel(end);};
    let currentUser=null,projects=[],activeProjectId='',issues=[],calendarIssues=[],calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),editingIssue=null,calendarDetailIssue=null,newBeforePhotoFile=null,newAfterPhotoFile=null,existingBeforePhotoPath='',existingAfterPhotoPath='',realtimeChannel=null,reloadTimer=null;

    function notice(text,isError){$('appNotice').textContent=text||'';$('appNotice').style.color=isError?'#b91c1c':'#075985';}
    function authNotice(text,isError){$('authNotice').textContent=text||'';$('authNotice').style.color=isError?'#b91c1c':'#075985';}
    function priorityClass(v){return v==='高'?'priority-high':v==='低'?'priority-low':'priority-mid';}
    function statusClass(v){return v==='対応中'?'status-progress':v==='回答待ち'?'status-wait':v==='完了'?'status-done':'status-open';}

    async function sendLoginLink(){
      const email=$('email').value.trim();
      if(!email){authNotice('メールアドレスを入力してください。',true);return;}
      $('sendLink').disabled=true;authNotice('ログインリンクを送信しています。');
      const result=await client.auth.signInWithOtp({email:email,options:{emailRedirectTo:window.location.origin}});
      $('sendLink').disabled=false;
      authNotice(result.error?'送信できませんでした：'+result.error.message:'メールを送信しました。届いたリンクを開いてください。',!!result.error);
    }
    async function setSession(session){
      currentUser=session&&session.user?session.user:null;
      if(!currentUser){$('authGate').hidden=false;$('workspace').hidden=true;return;}
      $('authGate').hidden=true;$('workspace').hidden=false;$('accountEmail').textContent=currentUser.email||'';
      await loadProjects();
    }
    async function loadProjects(){
      notice('読み込み中です。');
      const result=await client.from('issue_projects').select('*').order('created_at');
      if(result.error){notice('データの読み込みに失敗しました：'+result.error.message,true);return;}
      projects=result.data||[];
      if(!projects.length){activeProjectId='';renderProjects();renderIssues();notice('工事を追加してください。');return;}
      if(!projects.some(function(p){return p.id===activeProjectId;}))activeProjectId=projects[0].id;
      renderProjects();await Promise.all([loadIssues(),loadCalendarIssues()]);
    }
    function scheduleSharedReload(){
      clearTimeout(reloadTimer);
      reloadTimer=setTimeout(function(){loadProjects();},350);
    }
    function startSharedSync(){
      if(realtimeChannel)return;
      realtimeChannel=client.channel('issue-management-shared-sync')
        .on('postgres_changes',{event:'*',schema:'public',table:'issue_projects'},scheduleSharedReload)
        .on('postgres_changes',{event:'*',schema:'public',table:'issues'},scheduleSharedReload)
        .subscribe();
    }
    async function loadCalendarIssues(){
      if(!projects.length){calendarIssues=[];renderCalendar();return;}
      const result=await client.from('issues').select('id,project_id,title,priority,status,work_start_date,work_end_date,due_date').in('project_id',projects.map(function(project){return project.id;}));
      if(result.error){notice('カレンダーを読み込めませんでした：'+result.error.message,true);return;}
      calendarIssues=result.data||[];renderCalendar();
    }
    function calendarDate(value){return new Date(value.getFullYear(),value.getMonth(),value.getDate());}
    function dateKey(value){return value.getFullYear()+'-'+String(value.getMonth()+1).padStart(2,'0')+'-'+String(value.getDate()).padStart(2,'0');}
    function renderCalendar(){
      const cursor=calendarCursor,year=cursor.getFullYear(),month=cursor.getMonth(),first=new Date(year,month,1),gridStart=new Date(year,month,1-first.getDay()),todayKey=today();
      $('calendarTitle').textContent=year+'年'+(month+1)+'月';
      const projectNames={};projects.forEach(function(project){projectNames[project.id]=project.name;});
      let html=['日','月','火','水','木','金','土'].map(function(day){return '<div class="calendar-weekday">'+day+'</div>';}).join('');
      for(let offset=0;offset<42;offset++){
        const day=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+offset),key=dateKey(day),muted=day.getMonth()!==month;
        const events=calendarIssues.filter(function(item){const start=item.work_start_date||item.due_date,end=item.work_end_date||item.due_date;return start&&end&&start<=key&&key<=end;});
        html+='<div class="calendar-day '+(muted?'muted ':'')+(key===todayKey?'today':'')+'"><div class="calendar-date">'+day.getDate()+'</div>'+events.map(function(item){return '<button type="button" class="calendar-event '+(item.priority==='高'?'high ':'')+(item.status==='完了'?'done ':'')+'" title="'+esc(projectNames[item.project_id]||'')+'：'+esc(item.title)+'" data-calendar-issue="'+item.id+'">'+esc(projectNames[item.project_id]||'')+'｜'+esc(item.title)+'</button>';}).join('')+'</div>';
      }
      $('calendar').innerHTML=html;$('calendar').querySelectorAll('[data-calendar-issue]').forEach(function(button){button.onclick=function(){openCalendarIssue(button.dataset.calendarIssue);};});
    }
    async function openCalendarIssue(id){
      const result=await client.from('issues').select('*').eq('id',id).single();
      if(result.error){notice('詳細を読み込めませんでした：'+result.error.message,true);return;}
      const item=result.data,beforePath=item.before_photo_path||item.photo_path||'',afterPath=item.after_photo_path||'';
      const urls=await Promise.all([beforePath,afterPath].map(async function(path){if(!path)return '';const signed=await client.storage.from('patrol-photos').createSignedUrl(path,3600);return signed.data&&signed.data.signedUrl?signed.data.signedUrl:'';}));
      calendarDetailIssue=Object.assign({},item,{before_photo_url:urls[0],after_photo_url:urls[1]});
      const project=projects.find(function(p){return p.id===item.project_id;}),resources=(item.required_personnel?'必要人員：'+esc(item.required_personnel):'')+(item.required_personnel&&item.required_equipment?'　':'')+(item.required_equipment?'必要機材：'+esc(item.required_equipment):'');
      $('calendarDetailBody').innerHTML='<p class="sub">工事名：'+esc(project?project.name:'')+'</p><h3 style="margin:8px 0">'+esc(item.title)+'</h3><p><span class="badge '+priorityClass(item.priority)+'">'+esc(item.priority)+'</span> <span class="badge '+statusClass(item.status)+'">'+esc(item.status)+'</span></p><p class="sub">発信元：'+esc(item.source||'未入力')+'<br>担当者：'+esc(item.assignee||'未入力')+'<br>対応期間：'+esc(rangeLabel(item.work_start_date||item.due_date,item.work_end_date||item.due_date))+'</p>'+(resources?'<p class="sub">'+resources+'</p>':'')+'<p style="white-space:pre-wrap">'+esc(item.memo||'メモはありません')+'</p>'+photoPairMarkup(urls[0],urls[1]);
      $('calendarDetailDialog').showModal();
    }
    async function loadIssues(){
      if(!activeProjectId){issues=[];renderIssues();return;}
      notice('読み込み中です。');
      const result=await client.from('issues').select('*').eq('project_id',activeProjectId).order('due_date').order('created_at',{ascending:false});
      if(result.error){notice('事項を読み込めませんでした：'+result.error.message,true);return;}
      issues=await Promise.all((result.data||[]).map(async function(item){
        const beforePath=item.before_photo_path||item.photo_path||'',afterPath=item.after_photo_path||'';
        const urls=await Promise.all([beforePath,afterPath].map(async function(path){
          if(!path)return '';
          const signed=await client.storage.from('patrol-photos').createSignedUrl(path,3600);
          return signed.data&&signed.data.signedUrl?signed.data.signedUrl:'';
        }));
        return Object.assign({},item,{before_photo_url:urls[0],after_photo_url:urls[1]});
      }));
      renderIssues();notice('');
    }
    function renderProjects(){
      $('projectTabs').innerHTML=projects.map(function(p){return '<button class="secondary project-tab '+(p.id===activeProjectId?'active':'')+'" data-project="'+p.id+'">'+esc(p.name)+'</button>';}).join('');
      $('listTitle').textContent=(projects.find(function(p){return p.id===activeProjectId;})||{name:'未対応事項'}).name+' の未対応事項';
      $('projectTabs').querySelectorAll('[data-project]').forEach(function(button){button.onclick=async function(){activeProjectId=button.dataset.project;renderProjects();await loadIssues();};});
      renderProjectList();
    }
    function filteredIssues(){
      const query=$('search').value.trim().toLowerCase(),status=$('statusFilter').value,priority=$('priorityFilter').value,due=$('dueFilter').value;
      return issues.filter(function(item){const start=item.work_start_date||item.due_date,end=item.work_end_date||item.due_date;return (!query||[item.title,item.assignee,item.source,item.memo,item.required_personnel,item.required_equipment].join(' ').toLowerCase().indexOf(query)>=0)&&(!status||item.status===status)&&(!priority||item.priority===priority)&&(!due||(start<=due&&due<=end));});
    }
    function photoPairMarkup(beforeUrl,afterUrl){
      if(!beforeUrl&&!afterUrl)return '';
      const before=beforeUrl?'<img src="'+esc(beforeUrl)+'" alt="対応前写真">':'<div class="photo-empty">未添付</div>';
      const after=afterUrl?'<img src="'+esc(afterUrl)+'" alt="対応後写真">':'<div class="photo-empty">未添付</div>';
      return '<div class="photo-pair"><figure class="photo-box">'+before+'<figcaption>対応前</figcaption></figure><figure class="photo-box">'+after+'<figcaption>対応後</figcaption></figure></div>';
    }
    function renderIssues(){
      const list=filteredIssues(),now=today();
      $('issues').innerHTML=list.map(function(item){
        const photos=photoPairMarkup(item.before_photo_url,item.after_photo_url);
        const start=item.work_start_date||item.due_date,end=item.work_end_date||item.due_date;
        const resources=(item.required_personnel?'必要人員：'+esc(item.required_personnel):'')+(item.required_personnel&&item.required_equipment?'　':'')+(item.required_equipment?'必要機材：'+esc(item.required_equipment):'');
        return '<div class="issue"><span class="badge '+priorityClass(item.priority)+'">'+esc(item.priority)+'</span><div><div class="issue-title">'+esc(item.title)+'</div><div class="sub">'+esc(item.source||'')+'　担当：'+esc(item.assignee)+'　対応期間：<span style="color:'+(item.status!=='完了'&&end<now?'#b91c1c':'inherit')+'">'+rangeLabel(start,end)+'</span></div>'+(resources?'<div class="sub">'+resources+'</div>':'')+'<div class="sub">'+esc(item.memo||'')+'</div>'+photos+'</div><div><span class="badge '+statusClass(item.status)+'">'+esc(item.status)+'</span><div class="actions" style="margin-top:7px"><button class="secondary mini" data-edit="'+item.id+'">編集</button><button class="danger mini" data-delete="'+item.id+'">削除</button></div></div></div>';
      }).join('');
      $('empty').hidden=list.length>0;
      const current=issues;
      $('openCount').textContent=current.filter(function(x){return x.status!=='完了';}).length;
      $('overdueCount').textContent=current.filter(function(x){return x.status!=='完了'&&(x.work_end_date||x.due_date)<now;}).length;
      $('waitingCount').textContent=current.filter(function(x){return x.status==='回答待ち';}).length;
      $('doneCount').textContent=current.filter(function(x){return x.status==='完了';}).length;
      $('issues').querySelectorAll('[data-edit]').forEach(function(button){button.onclick=function(){openIssue(issues.find(function(x){return x.id===button.dataset.edit;}));};});
      $('issues').querySelectorAll('[data-delete]').forEach(function(button){button.onclick=function(){deleteIssue(button.dataset.delete);};});
    }
    function openIssue(item){
      if(!activeProjectId){notice('先に工事を追加してください。',true);return;}
      editingIssue=item||null;newBeforePhotoFile=null;newAfterPhotoFile=null;
      existingBeforePhotoPath=item?(item.before_photo_path||item.photo_path||''):'';
      existingAfterPhotoPath=item?(item.after_photo_path||''):'';
      $('issueForm').reset();$('beforePreview').innerHTML='';$('afterPreview').innerHTML='';$('issueDialogTitle').textContent=item?'未対応事項を編集':'未対応事項を追加';
      if(item){
        $('title').value=item.title;$('source').value=item.source||'';$('assignee').value=item.assignee;$('requiredPersonnel').value=item.required_personnel||'';$('requiredEquipment').value=item.required_equipment||'';$('workStartDate').value=item.work_start_date||item.due_date;$('workEndDate').value=item.work_end_date||item.due_date;$('priority').value=item.priority;$('status').value=item.status;$('memo').value=item.memo||'';
        if(item.before_photo_url)$('beforePreview').innerHTML='<img class="photo-preview" src="'+esc(item.before_photo_url)+'" alt="対応前写真">';
        if(item.after_photo_url)$('afterPreview').innerHTML='<img class="photo-preview" src="'+esc(item.after_photo_url)+'" alt="対応後写真">';
      } else {$('workStartDate').value=today();$('workEndDate').value=today();}
      $('issueDialog').showModal();
    }
    async function uploadIssuePhoto(file,existingPath,type){
      if(!file)return existingPath||null;
      const cleaned=file.name.replace(/[^A-Za-z0-9._-]/g,'_');
      const path='shared/issues/'+type+'_'+Date.now()+'_'+cleaned;
      const result=await client.storage.from('patrol-photos').upload(path,file,{upsert:false,contentType:file.type});
      if(result.error)throw result.error;
      return path;
    }
    async function saveIssue(event){
      event.preventDefault();
      if($('workStartDate').value>$('workEndDate').value){notice('対応完了日は、対応開始日以降の日付にしてください。',true);return;}
      notice('保存しています。');
      let beforePhotoPath,afterPhotoPath;
      try{
        const uploaded=await Promise.all([
          uploadIssuePhoto(newBeforePhotoFile,existingBeforePhotoPath,'before'),
          uploadIssuePhoto(newAfterPhotoFile,existingAfterPhotoPath,'after')
        ]);
        beforePhotoPath=uploaded[0];afterPhotoPath=uploaded[1];
      }catch(error){notice('写真を保存できませんでした：'+error.message,true);return;}
      const payload={project_id:activeProjectId,title:$('title').value.trim(),source:$('source').value.trim(),assignee:$('assignee').value.trim(),required_personnel:$('requiredPersonnel').value.trim(),required_equipment:$('requiredEquipment').value.trim(),work_start_date:$('workStartDate').value,work_end_date:$('workEndDate').value,due_date:$('workEndDate').value,priority:$('priority').value,status:$('status').value,memo:$('memo').value.trim(),before_photo_path:beforePhotoPath,after_photo_path:afterPhotoPath,photo_path:beforePhotoPath,updated_at:new Date().toISOString()};
      const result=editingIssue?await client.from('issues').update(payload).eq('id',editingIssue.id):await client.from('issues').insert(payload);
      if(result.error){notice('保存できませんでした：'+result.error.message,true);return;}
      $('issueDialog').close();await Promise.all([loadIssues(),loadCalendarIssues()]);
    }
    async function deleteIssue(id){
      const issue=issues.find(function(item){return item.id===id;});
      if(!window.confirm('この未対応事項を削除しますか？添付写真も削除されます。'))return;
      const result=await client.from('issues').delete().eq('id',id);
      if(result.error){notice('削除できませんでした：'+result.error.message,true);return;}
      if(issue){
        const paths=Array.from(new Set([issue.before_photo_path,issue.after_photo_path,issue.photo_path].filter(Boolean)));
        if(paths.length){
          const photoResult=await client.storage.from('patrol-photos').remove(paths);
          if(photoResult.error)notice('未対応事項は削除しましたが、写真を削除できませんでした。',true);
        }
      }
      await Promise.all([loadIssues(),loadCalendarIssues()]);
    }
    async function excelImage(workbook,url){
      const response=await fetch(url);if(!response.ok)throw new Error('写真を取得できませんでした');
      let blob=await response.blob(),extension=blob.type.indexOf('png')>=0?'png':blob.type.indexOf('jpeg')>=0||blob.type.indexOf('jpg')>=0?'jpeg':'';
      if(!extension){
        const bitmap=await createImageBitmap(blob),canvas=document.createElement('canvas');
        canvas.width=bitmap.width;canvas.height=bitmap.height;canvas.getContext('2d').drawImage(bitmap,0,0);
        blob=await new Promise(function(resolve){canvas.toBlob(resolve,'image/png');});bitmap.close&&bitmap.close();extension='png';
      }
      return workbook.addImage({buffer:await blob.arrayBuffer(),extension:extension});
    }
    async function exportExcel(){
      if(!window.ExcelJS){notice('Excel出力機能を読み込めませんでした。',true);return;}
      if(!issues.length){notice('出力する未対応事項がありません。',true);return;}
      const button=$('excelExport');button.disabled=true;notice('Excelを作成しています。');
      try{
        const workbook=new ExcelJS.Workbook(),sheet=workbook.addWorksheet('是正報告',{views:[{state:'frozen',ySplit:1}]});
        const project=projects.find(function(p){return p.id===activeProjectId;}),siteName=project?project.name:'';
        sheet.columns=[
          {header:'現場名',key:'site',width:24},{header:'指摘事項',key:'title',width:32},{header:'発信元',key:'source',width:16},
          {header:'担当者',key:'assignee',width:16},{header:'状態',key:'status',width:12},
          {header:'優先度',key:'priority',width:10},{header:'対応期間',key:'period',width:22},{header:'必要人員',key:'personnel',width:20},
          {header:'必要機材',key:'equipment',width:20},{header:'確認・次アクション',key:'memo',width:32},
          {header:'対応前写真',key:'before',width:25},{header:'対応後写真',key:'after',width:25}
        ];
        const header=sheet.getRow(1);header.height=26;header.font={bold:true,color:{argb:'FFFFFFFF'}};header.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF123757'}};header.alignment={vertical:'middle',horizontal:'center'};
        for(let index=0;index<issues.length;index++){
          const item=issues[index],start=item.work_start_date||item.due_date,end=item.work_end_date||item.due_date;
          const row=sheet.addRow({site:siteName,title:item.title,source:item.source||'',assignee:item.assignee||'',status:item.status||'',priority:item.priority||'',period:rangeLabel(start,end),personnel:item.required_personnel||'',equipment:item.required_equipment||'',memo:item.memo||'',before:item.before_photo_url?'添付あり':'未添付',after:item.after_photo_url?'添付あり':'未添付'});
          row.height=125;row.alignment={vertical:'top',wrapText:true};
          for(const photo of [{url:item.before_photo_url,col:11},{url:item.after_photo_url,col:12}]){
            if(!photo.url)continue;
            try{
              const imageId=await excelImage(workbook,photo.url);
              sheet.addImage(imageId,{tl:{col:photo.col-1+0.08,row:row.number-1+0.08},ext:{width:145,height:110},editAs:'oneCell'});
            }catch(error){sheet.getCell(row.number,photo.col).value='写真の取得に失敗';console.warn(error);}
          }
        }
        sheet.autoFilter='A1:L1';
        const buffer=await workbook.xlsx.writeBuffer(),link=document.createElement('a');
        link.href=URL.createObjectURL(new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
        link.download=(siteName||'現場')+'_是正報告.xlsx';link.click();setTimeout(function(){URL.revokeObjectURL(link.href);},1000);
        notice('Excelを出力しました。');
      }catch(error){notice('Excelを出力できませんでした：'+error.message,true);}
      finally{button.disabled=false;}
    }
    function renderProjectList(){
      $('projectList').innerHTML=projects.map(function(p){return '<div class="project-row"><input data-project-name="'+p.id+'" value="'+esc(p.name)+'"><button class="secondary mini" data-save-project="'+p.id+'">保存</button><button class="danger mini" data-remove-project="'+p.id+'">削除</button></div>';}).join('');
      $('projectList').querySelectorAll('[data-save-project]').forEach(function(button){button.onclick=function(){saveProjectName(button.dataset.saveProject);};});
      $('projectList').querySelectorAll('[data-remove-project]').forEach(function(button){button.onclick=function(){removeProject(button.dataset.removeProject);};});
    }
    async function addProject(){
      const name=$('newProject').value.trim();if(!name)return;
      const result=await client.from('issue_projects').insert({name:name}).select().single();
      if(result.error){notice('工事を追加できませんでした：'+result.error.message,true);return;}
      $('newProject').value='';activeProjectId=result.data.id;await loadProjects();
    }
    async function saveProjectName(id){
      const input=$('projectList').querySelector('[data-project-name="'+id+'"]'),name=input.value.trim();if(!name)return;
      const result=await client.from('issue_projects').update({name:name}).eq('id',id);
      if(result.error){notice('工事名を保存できませんでした：'+result.error.message,true);return;}
      await loadProjects();
    }
    async function removeProject(id){
      const target=projects.find(function(p){return p.id===id;});
      if(!window.confirm((target?target.name:'この工事')+' を削除しますか？未対応事項が登録された工事は削除できません。'))return;
      const result=await client.from('issue_projects').delete().eq('id',id);
      if(result.error){notice('削除できませんでした：未対応事項が残っている場合は、先に削除してください。',true);return;}
      await loadProjects();
    }

    $('newIssue').onclick=function(){openIssue(null);};$('issueForm').onsubmit=saveIssue;$('excelExport').onclick=exportExcel;
    $('beforePhoto').onchange=function(e){newBeforePhotoFile=e.target.files[0]||null;if(!newBeforePhotoFile)return;const reader=new FileReader();reader.onload=function(){$('beforePreview').innerHTML='<img class="photo-preview" src="'+reader.result+'" alt="選択した対応前写真">';};reader.readAsDataURL(newBeforePhotoFile);};
    $('afterPhoto').onchange=function(e){newAfterPhotoFile=e.target.files[0]||null;if(!newAfterPhotoFile)return;const reader=new FileReader();reader.onload=function(){$('afterPreview').innerHTML='<img class="photo-preview" src="'+reader.result+'" alt="選択した対応後写真">';};reader.readAsDataURL(newAfterPhotoFile);};
    $('closeIssue').onclick=$('cancelIssue').onclick=function(){$('issueDialog').close();};
    $('closeCalendarDetail').onclick=$('doneCalendarDetail').onclick=function(){$('calendarDetailDialog').close();};
    $('editCalendarIssue').onclick=async function(){if(!calendarDetailIssue)return;activeProjectId=calendarDetailIssue.project_id;$('calendarDetailDialog').close();renderProjects();await loadIssues();openIssue(issues.find(function(item){return item.id===calendarDetailIssue.id;}));};
    $('manageProjects').onclick=function(){renderProjectList();$('projectDialog').showModal();};$('closeProjects').onclick=$('doneProjects').onclick=function(){$('projectDialog').close();};$('addProject').onclick=addProject;
    ['search','statusFilter','priorityFilter','dueFilter'].forEach(function(id){$(id).oninput=renderIssues;});
    $('clearFilters').onclick=function(){$('search').value='';$('statusFilter').value='';$('priorityFilter').value='';$('dueFilter').value='';renderIssues();};
    $('calendarPrev').onclick=function(){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1);renderCalendar();};
    $('calendarNext').onclick=function(){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1);renderCalendar();};
    startSharedSync();
    document.addEventListener('visibilitychange',function(){if(!document.hidden)loadProjects();});
    window.addEventListener('focus',loadProjects);
    loadProjects();
  })();
  </script>
</body>
</html>
